name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs an id token to claim the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# A superseded run is pointless, but never cancel one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # GITHUB_PAGES switches Vite's `base` to /pick-board/.
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      # Pages has no SPA rewrite, so a deep link like /pick-board/my-picks 404s
      # on refresh. Serving index.html as the 404 body hands the URL to the
      # router instead.
      - name: Add the SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
